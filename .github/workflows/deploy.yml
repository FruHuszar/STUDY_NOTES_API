name: Deploy API

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: api-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DATABASE_ID: ${{ secrets.DATABASE_ID }}
      ALLOWED_ORIGINS: ${{ secrets.ALLOWED_ORIGINS }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Fill in private settings
        run: |
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID DATABASE_ID ALLOWED_ORIGINS GOOGLE_CLIENT_ID; do
            if [ -z "${!name}" ]; then echo "Missing repository secret: $name"; exit 1; fi
          done
          sed -i "s|DATABASE_ID_FROM_SECRET|${DATABASE_ID}|" wrangler.toml
          cat >> wrangler.toml <<EOF

          [vars]
          ALLOWED_ORIGINS = "${ALLOWED_ORIGINS}"
          GOOGLE_CLIENT_ID = "${GOOGLE_CLIENT_ID}"
          EOF
      - name: Apply database migrations
        run: npx wrangler d1 migrations apply study-notes --remote
      - name: Deploy Worker
        run: npx wrangler deploy
